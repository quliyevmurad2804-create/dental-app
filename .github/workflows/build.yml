name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config

    - name: Install Buildozer and Cython
      run: |
        # Устанавливаем стабильную версию pip и virtualenv для чистой среды
        python -m pip install "pip<24.1"
        pip install cython==0.29.36 buildozer virtualenv

    - name: Build with Buildozer
      env:
        # Жестко запрещаем внутренним скриптам обновлять pip до проблемной версии
        PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
      run: |
        echo "pip<24.1" > constraints.txt
        set +o pipefail
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
